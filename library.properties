name=RPiPico-RA8876
version=1.0.0
author=Bodmer (TFT_eSPI graphics), Warren Watson, mjs513, KurtE, MorganS (RA8876 sequences), bocabob
maintainer=bocabob
sentence=Graphics for an RA8876 display (ER-TFTM101-1, 1024 x 600) on a Raspberry Pi Pico or Pico 2 over SPI, with the controller's hardware features.
paragraph=The TFT_eSPI drawing, font, sprite and anti-aliasing API, plus RA8876 hardware fills, display pages, page flipping, block copies, hardware scrolling, flicker-free off-screen composition, picture-in-picture windows and character ROM fonts. Pins and SPI port are set at run time. Needs the Earle Philhower arduino-pico core.
category=Display
